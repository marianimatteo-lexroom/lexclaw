name: Ada CI

# Ada is the only code this fork owns. `pnpm check:ada` is its single gate
# (format, lint, types, test types, hook allowlist, tests). The job name
# `check-ada` is the required-status-check candidate. It runs on every pull
# request, with no path filter, so the check always reports and a required
# check never waits on a skipped workflow.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ada-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-ada:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
          submodules: false

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          install-bun: "false"

      - name: Check Ada
        run: pnpm check:ada
